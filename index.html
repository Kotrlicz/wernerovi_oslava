<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foto hádačka</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="start-screen" id="start-screen" aria-labelledby="app-title">
        <p class="eyebrow">Týmová hra</p>
        <h1 id="app-title">Foto hádačka</h1>
        <p class="start-lead">
          Odkrývejte políčka, sbírejte indicie a zkuste uhodnout, kdo je na
          fotografii — případně i kde byla pořízena.
        </p>

        <div class="start-form">
          <label>
            Počet týmů
            <select id="team-count" aria-label="Počet týmů">
              <option value="2">2 týmy</option>
              <option value="3">3 týmy</option>
              <option value="4">4 týmy</option>
              <option value="5">5 týmů</option>
              <option value="6">6 týmů</option>
            </select>
          </label>
          <button id="start-game" type="button">Začít hru</button>
        </div>
      </section>

      <section class="game-panel hidden" id="game-panel" aria-label="Herní plocha" hidden>
        <div class="toolbar">
          <p class="team-summary" id="team-summary" aria-live="polite"></p>
          <div class="toolbar-actions">
            <button id="reset-board" type="button">Resetovat kolo</button>
            <button id="reset-order" type="button">Resetovat pořadí</button>
            <button id="reveal-all" type="button">Odkrýt celou fotku</button>
            <button id="next-photo" type="button">Další fotka</button>
          </div>
        </div>

        <p class="session-status" id="session-status" aria-live="polite"></p>

        <div class="scoreboard" id="scoreboard" aria-live="polite"></div>

        <div class="question-card">
          <span>Otázka k fotce</span>
          <strong id="question-text">Kdo je na fotce?</strong>
        </div>

        <div class="guess-actions" id="guess-actions" aria-label="Udělit bod týmu"></div>

        <div class="photo-board" aria-label="Zakrytá fotografie">
          <div class="photo-frame">
            <img id="photo" src="" alt="Zakrytá fotografie pro hru" />
            <div class="tile-grid" id="tile-grid" aria-label="Kliknutím odkrývejte políčka"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="photos.js?v=3"></script>
    <script src="app.js?v=3"></script>
  </body>
</html>
